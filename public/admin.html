<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio Admin | Transformation Laser Studio</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="admin.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/transformation-logo.png" alt="Transformation Laser Studio" /></a>
    <a class="button ghost" href="index.html">Back to website</a>
  </header>
  <main class="admin-main">
    <p class="eyebrow">Studio dashboard</p>
    <h1 style="font-size:clamp(2.8rem,6vw,5.4rem)">Booking requests</h1>
    <p>Review requests in order received, then confirm or decline them.</p>
    <div class="admin-toolbar">
      <form id="login-form" class="admin-toolbar">
        <label>Admin password <input id="admin-pin" type="password" autocomplete="current-password" maxlength="256" required /></label>
        <button class="button primary" id="login" type="submit">Sign in</button>
      </form>
      <button class="button primary" id="load-bookings" type="button" hidden>Refresh bookings</button>
      <button class="button ghost" id="logout" type="button" hidden>Sign out</button>
      <span id="admin-message" aria-live="polite"></span>
    </div>

    <section class="accepted-export" aria-labelledby="accepted-export-title">
      <div>
        <p class="eyebrow">Accepted bookings</p>
        <h2 id="accepted-export-title">Weekly Excel export</h2>
        <p>Choose a week to download the accepted appointments scheduled for that week as an Excel file.</p>
      </div>
      <div class="accepted-export-controls">
        <label>Appointment week <input id="export-week" type="week" /></label>
        <button class="button secondary" id="export-accepted" disabled>Export accepted week (.xlsx)</button>
        <span id="export-message" aria-live="polite"></span>
      </div>
    </section>

    <div id="admin-list" class="admin-list"></div>
  </main>
</body>
</html>
